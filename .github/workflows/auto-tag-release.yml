name: Auto Tag and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit version/tag without v prefix, for example 1.2.3"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: auto-tag-release-main
  cancel-in-progress: false

jobs:
  tag-and-release:
    name: Create Git tag and GitHub Release
    runs-on: ubuntu-latest
    if: github.repository == 'hitechcloud-vietnam/.agents-whmcs'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Actions bot identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve next tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          input_version="${{ github.event.inputs.version || '' }}"
          if [[ -n "${input_version}" ]]; then
            tag="${input_version}"
            [[ "${tag}" == v* ]] || tag="v${tag}"
          else
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
            if [[ -z "${latest_tag}" ]]; then
              tag="v1.0.0"
            else
              version="${latest_tag#v}"
              IFS='.' read -r major minor patch <<< "${version}"
              major="${major:-0}"
              minor="${minor:-0}"
              patch="${patch:-0}"
              patch=$((patch + 1))
              tag="v${major}.${minor}.${patch}"
            fi
          fi

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists. Nothing to release."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create annotated tag
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git tag -a "${tag}" -m "Release ${tag}" "${GITHUB_SHA}"
          git push origin "${tag}"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
